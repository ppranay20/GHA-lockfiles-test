name: Lockfile check
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Lockfile matches the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock
          gh actions-lock --verify